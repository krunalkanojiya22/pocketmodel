[project]
name = "pocketmodel"
version = "0.2.0"
description = "Train a GPT-style language model from your own text — no pre-trained weights"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.3",
    "numpy>=2.0",
    "tiktoken>=0.7",
    "accelerate>=0.30",
    "wandb>=0.17",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# flash-attn requires CUDA + compilation; PyTorch 2.x SDPA uses FA kernels automatically on CUDA
flash = ["flash-attn>=2.5"]

[tool.uv]
python-preference = "managed"
