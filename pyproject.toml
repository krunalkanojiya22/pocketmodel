[project]
name = "gpt-2"
version = "0.1.0"
description = "GPT-2 language model — OpenAI (archived)"
requires-python = ">=3.10,<3.12"
dependencies = [
    "tensorflow>=2.13,<2.16",
    "fire>=0.1.3",
    "regex>=2017.4.5",
    "requests>=2.21.0",
    "tqdm>=4.31.1",
    "numpy<2.0",
    "sentencepiece>=0.1.99",
]

[tool.uv]
python-preference = "managed"
